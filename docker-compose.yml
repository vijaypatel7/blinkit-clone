services:
  mongodb:
    image: mongo:7
    container_name: blinkit-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongodb-data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok === 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: blinkit-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:

    image: ${DOCKERHUB_USERNAME}/blinkit-clone-backend@sha256:<BACKEND_DIGEST>
    container_name: blinkit-backend

    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - ./backend/.env

    environment:

      MONGODB_URI: mongodb://mongodb:27017/blinkit
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:

    image: ${DOCKERHUB_USERNAME}/${FRONTEND_IMAGE}@sha256:<FRONTEND_DIGEST>
    container_name: blinkit-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      backend:
        condition: service_started

volumes:
  mongodb-data:
    name: blinkit-mongodb-data

  redis-data:
    name: blinkit-redis-data