name: Blinkit Clone CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: CI - Test, Build and Push
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

        # 1. CHECKOUT
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. NODE.JS SETUP

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # 3. BACKEND CI

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend syntax check
        working-directory: backend
        run: node --check src/server.js

      - name: Run backend tests
        working-directory: backend
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/blinkit_test
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: npm test

      # 4. FRONTEND CI

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

        # 5. DOCKER SETUP

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. DOCKER HUB LOGIN
      # Only on push to main

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. BUILD & PUSH BACKEND IMAGE

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/blinkit-clone-backend:sha-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/blinkit-clone-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 8. BUILD & PUSH FRONTEND IMAGE
      
      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/blinkit-clone-frontend:sha-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/blinkit-clone-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max